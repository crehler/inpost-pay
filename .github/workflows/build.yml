name: Build & Release

# Buduje storefront + admin, tworzy ZIP i GitHub Release (FriendsOfShopware).
# FoS sam czyta wersję z composer.json, tworzy tag vx.x.x i Release — dlatego
# wyzwalacz to push na branch mirrora (publish.yml force-pushuje tam kod),
# a NIE push tagu (FoS pominąłby release, gdyby tag już istniał).
#
# Uśpiony na repo źródłowym (guard niżej), aktywny tylko na mirrorze.
on:
  push:
    branches: [shopware_65]

jobs:
  build:
    # Nie uruchamiaj na repo źródłowym — tylko na mirrorze (crehler/inpost).
    if: github.repository != 'crehler-com/InpostPay'
    # GITHUB_TOKEN mirrora musi moc pushowac tag i tworzyc Release (FoS).
    permissions:
      contents: write
    uses: FriendsOfShopware/actions/.github/workflows/github.yml@main
    with:
      extensionName: InpostPay
      shopwareVersion: '6.5.0'
    secrets:
      ghToken: ${{ secrets.GITHUB_TOKEN }}
